[pytest]
# Generated by `ducktest configure` — re-run it to refresh. Safe to edit by hand
# (configure won't overwrite a modified copy; it stops and shows a diff instead).
#
# -n auto + loadgroup need the [xdist] extra installed; drop them for single-process.
# -n 4 (not auto): azurite is single-threaded, so many workers just contend on it (and floor the CPU).
# --batch-size 1 (not the default 10): these suites are small (~25 tests), so batching would collapse
# them to 1-2 batches (each pinned to one worker) -> little parallelism + no live progress. Unbatched
# spreads every test across the workers and reports each as it finishes.
addopts = -n 4 --batch-size 1 --dist=loadgroup --import-mode=importlib
# Keep pytest out of scripts/, tools/, third_party/, and nested checkouts.
testpaths = test
# The driver collector owns .test discovery; disable pytest's native test_*.py pickup
# (many duckdb repos ship non-pytest scripts named test_*.py that sys.exit at import).
# EXCEPTION: enabled so the pure-Python azurite sandbox test (test/azurite/) collects.
python_files = test_*.py
