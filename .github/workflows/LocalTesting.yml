
name: Azurite (local) functional tests
on: [push, pull_request,repository_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  azurite-tests-linux:
    name: Azurite tests (Linux)
    runs-on: ubuntu-latest
    env:
      # NOTE: container/authn env is managed in scripts/env_azurite so that local test
      # runs are easily managed
      VCPKG_TARGET_TRIPLET: 'x64-linux'
      GEN: ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      HTTP_PROXY_RUNNING: '1'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'true'

    - uses: actions/setup-node@v4

    - name: install Azure test service
      run: |
        sudo apt-get update -y -q
        sudo apt-get install -y -q azure-cli squid ninja-build
        npm install -g azurite

    - name: Launch & populate Azure test service
      run: |
        azurite > azurite_log.txt 2>&1 &
        sudo ./scripts/run_squid.sh --port 3128 --log_dir squid_logs &
        sudo ./scripts/run_squid.sh --port 3129 --log_dir squid_auth_logs --auth &
        sleep 10
        ./scripts/upload_test_files_to_azurite.sh

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.1
      with:
        vcpkgGitCommitId: ce613c41372b23b1f51333815feb3edd87ef8a8b

    - &ccache
      name: Add ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: ccache
        key: ${{ github.job }}-${{ matrix.duckdb_arch }}
        restore-keys: ${{ github.job }}-${{ matrix.duckdb_arch }}
        verbose: 1
        evict-old-files: 7d

    # Build extension
    - name: Build extension
      env:
        GEN: ninja
      run: |
        make release

    - name: Test extension
      run: |
        scripts/env_azurite --az build/release/test/unittest 'test/*'

    - name: Run test data integrity check
      env:
        DUCKDB_AZURE_PERSISTENT_SECRET_AVAILABLE: 1
      run: |
        ./build/release/duckdb -c "CREATE PERSISTENT SECRET s1 (TYPE AZURE, CONNECTION_STRING '$AZURE_STORAGE_CONNECTION_STRING')"
        ./build/release/test/unittest "*test/sql/test_data_integrity.test"

    - name: Azure test server log
      if: always()
      shell: bash
      run: |
        echo "## azurite"
        cat azurite_log.txt

        echo "## squid"
        sudo cat squid_logs/*

        echo "## squid auth"
        sudo cat squid_auth_logs/*

  azurite-tests-macos:
    name: Azurite tests (MacOS)
    runs-on: macos-latest
    env:
      VCPKG_TARGET_TRIPLET: 'x64-osx'
      OSX_BUILD_ARCH: 'x86_64'
      GEN: ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Install Ninja
        run: brew install ninja

      - uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ce613c41372b23b1f51333815feb3edd87ef8a8b

      - *ccache

      - name: Build extension
        shell: bash
        run: |
          make release

      - uses: actions/setup-node@v3
      - name: Launch & populate Azure test service
        run: |
          npm install -g azurite
          azurite > azurite_log.txt 2>&1 &
          sleep 10
          ./scripts/upload_test_files_to_azurite.sh

      - name: Test Extension
        shell: bash
        run: |
          scripts/env_azurite --az build/release/test/unittest 'test/*'

      - name: Run test data integrity check
        env:
          DUCKDB_AZURE_PERSISTENT_SECRET_AVAILABLE: 1
        run: |
          ./build/release/duckdb -c "CREATE PERSISTENT SECRET s1 (TYPE AZURE, CONNECTION_STRING '$AZURE_STORAGE_CONNECTION_STRING')"
          ./build/release/test/unittest "*test/sql/test_data_integrity.test"

      - name: Azure test server log
        if: always()
        shell: bash
        run: |
          echo "## azurite"
          cat azurite_log.txt

  azurite-tests-windows:
    name: Azurite tests (Windows)
    runs-on: windows-latest
    env:
      VCPKG_TARGET_TRIPLET: 'x64-windows'
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ce613c41372b23b1f51333815feb3edd87ef8a8b

      - uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - &sccache
        name: Add sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: ${{ github.job }}-${{ matrix.duckdb_arch }}
          restore-keys: ${{ github.job }}-${{ matrix.duckdb_arch }}
          verbose: 1

      - name: Build extension
        run: |
          make release

      - uses: actions/setup-node@v3
      - name: Launch & populate Azure test service
        run: |
          npm install -g azurite
          azurite > azurite_log.txt 2>&1 &
          sleep 10
          ./scripts/upload_test_files_to_azurite.sh

      - name: Test Extension
        shell: bash
        run: |
          scripts/env_azurite --az build/release/test/Release/unittest 'test/*'

      - name: Test persistent secret retention
        env:
          DUCKDB_AZURE_PERSISTENT_SECRET_AVAILABLE: 1
        run: |
          scripts/env_azurite build/release/test/Release/unittest "test/sql/authn/persistent_secret_p1_create__local_az.test"
          scripts/env_azurite build/release/test/Release/unittest "test/sql/authn/persistent_secret_p2_use__local_az.test"

      - name: Azure test server log
        if: always()
        shell: bash
        run: |
          cat azurite_log.txt

      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
